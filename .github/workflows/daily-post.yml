name: Daily LinkedIn Post

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Custom post topic (leave empty to pick from GitHub Issues or AI trends)"
        type: string
        required: false
      persona:
        description: "Agent persona (e.g., 'AI Product PM', 'Founder')"
        type: string
        required: false
      context:
        description: "Specific context / background notes for the post"
        type: string
        required: false
      image_mode:
        description: "Image Mode: 'ai' (DALL-E 3 / Recraft V3 / FLUX photo), 'carousel' (3-slide PDF Carousel), 'poll' (Interactive Poll), 'none' (text-only), or 'card'"
        type: choice
        options:
          - none
          - ai
          - carousel
          - poll
          - card
        default: none
      dry_run:
        description: "Preview only: generate post + image/carousel, save as artifact, do NOT post"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache trend topics & post history
        uses: actions/cache@v4
        with:
          path: |
            topics_cache.json
            history_posts.json
          key: post-history-${{ github.run_id }}
          restore-keys: |
            post-history-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Publish post
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_PERSON_URN: ${{ secrets.LINKEDIN_PERSON_URN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RECRAFT_API_KEY: ${{ secrets.RECRAFT_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TOPIC: ${{ inputs.topic }}
          PERSONA: ${{ inputs.persona }}
          CONTEXT: ${{ inputs.context }}
          IMAGE_MODE: ${{ inputs.image_mode || 'none' }}
          DRY_RUN: ${{ inputs.dry_run }}
          FIRST_COMMENT_MODE: "true"
        run: python post.py

      - name: Commit & push updated post history
        if: always() && inputs.dry_run != true
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history_posts.json topics_cache.json upcoming_posts.json || true
          git commit -m "Update post history & deduplication cache [skip ci]" || true
          git push origin development || true

      - name: Upload generated post + image
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linkedin-post
          path: |
            out_image.png
            out_carousel.pdf
            out_post.txt
          if-no-files-found: ignore


