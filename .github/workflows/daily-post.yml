name: Daily LinkedIn Post

on:
  schedule:
    - cron: "30 6 * * *" # Daily at 06:30 UTC / 12:00 PM IST
  workflow_dispatch:
    inputs:
      topic:
        description: "Custom post topic (leave empty to pick from GitHub Issues or AI trends)"
        type: string
        required: false
      persona:
        description: "Agent persona (e.g., 'AI Product PM', 'Founder')"
        type: string
        required: false
      context:
        description: "Specific context / background notes for the post"
        type: string
        required: false
      dry_run:
        description: "Preview only: generate post + image, save as artifact, do NOT post"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache trend topics (daily)
        uses: actions/cache@v4
        with:
          path: topics_cache.json
          key: trend-topics-${{ github.run_id }}
          restore-keys: |
            trend-topics-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Publish post
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_PERSON_URN: ${{ secrets.LINKEDIN_PERSON_URN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TOPIC: ${{ inputs.topic }}
          PERSONA: ${{ inputs.persona }}
          CONTEXT: ${{ inputs.context }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: python post.py

      - name: Upload generated post + image
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linkedin-post
          path: |
            out_image.png
            out_post.txt
          if-no-files-found: ignore

