name: Sync Gemini Secret

on:
  workflow_dispatch:

jobs:
  sync-secret:
    runs-on: ubuntu-latest
    steps:
      - name: Sync GEMINI_API_KEY secret
        env:
          GEMINI_SECRET: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GEMINI_SECRET" | gh secret set GEMINI_API_KEY --repo BA-AkshatJindal/faceless-video-factory
